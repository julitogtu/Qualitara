server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin /api: the browser never talks to the api container directly, so no CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change under the same name.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: deep links and F5 on /accounts/6/week/2026-06-01 get index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
